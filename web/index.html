<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlySnake</title>
<style>body{margin:0;background:#081217;color:#e5f7ee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(900px,94vw);padding:2rem;background:#0d1d24;border:1px solid #23505b;border-radius:20px}h1{color:#8df0b7;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}canvas{background:#050b0e;width:100%;image-rendering:pixelated;border-radius:12px}button{background:#8df0b7;border:0;border-radius:9px;padding:.7rem 1rem;font-weight:700;cursor:pointer}.bar{height:12px;background:#18343c;border-radius:8px;overflow:hidden;margin:.4rem 0}.bar i{display:block;height:100%;background:#8df0b7}small{color:#93abb1}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>FlySnake <small>fixed reservoir → trained linear readout</small></h1><p id="status">Ready. Build the response bank and readout, then start.</p><button id="run">Run step</button> <button id="play">Autoplay</button> <button id="reset">Reset</button><div class="grid"><canvas id="snake" width="360" height="280"></canvas><section><h2>Readout</h2><div id="bars"></div><h2>Reservoir activity</h2><canvas id="brain" width="360" height="220"></canvas><p id="detail"></p></section></div></main>
<script>const snake=document.querySelector('#snake'),brain=document.querySelector('#brain'),s=snake.getContext('2d'),b=brain.getContext('2d'),status=document.querySelector('#status'),run=document.querySelector('#run'),play=document.querySelector('#play'),reset=document.querySelector('#reset');let timer;function draw(d){s.fillStyle='#050b0e';s.fillRect(0,0,360,280);let cw=360/d.width,ch=280/d.height;s.fillStyle='#f55';s.fillRect(d.food[0]*cw,d.food[1]*ch,cw,ch);s.fillStyle='#8df0b7';d.body.forEach(p=>s.fillRect(p[0]*cw,p[1]*ch,cw-1,ch-1));b.fillStyle='#050b0e';b.fillRect(0,0,360,220);for(let i=0;i<420;i++){let x=(i%28)*13+8,y=Math.floor(i/28)*14+8;b.fillStyle=d.active_neurons.includes(i)?'#8df0b7':'#19343b';b.beginPath();b.arc(x,y,3,0,7);b.fill()}document.querySelector('#bars').innerHTML=['left','straight','right'].map((x,i)=>`<label>${x} ${(d.probabilities[i]*100).toFixed(0)}%</label><div class=bar><i style="width:${d.probabilities[i]*100}%"></i></div>`).join('');document.querySelector('#detail').textContent=`Action: ${d.action} · Score: ${d.score} · ${d.alive?'alive':'game over'}`}async function step(){let r=await fetch('/api/step',{method:'POST'}),d=await r.json();if(d.error){status.textContent=d.error;clearInterval(timer);timer=null;return}draw(d);status.textContent='Brain → readout → Snake';if(!d.alive){clearInterval(timer);timer=null;play.textContent='Autoplay'}}run.onclick=step;play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='Autoplay'}else{timer=setInterval(step,240);play.textContent='Pause';step()}};reset.onclick=async()=>{clearInterval(timer);timer=null;play.textContent='Autoplay';let r=await fetch('/api/reset',{method:'POST'});draw(await r.json())}</script></body></html>
